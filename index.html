<title>Mars Mission Designer</title>

<style>
:root{
  --bg:#EEF1F5;--surface:#FFFFFF;--ink:#16213A;--muted:#58657E;--line:#C9D1DD;--track:#DDE3EC;
  --accent:#0E7C86;--accent-ink:#FFFFFF;--warn:#9A6A00;--bad:#B3261E;--good:#2E7D32;--tile:#E3F1F2;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1827;--surface:#172236;--ink:#E7EDF7;--muted:#9AA8C0;--line:#2B3A55;--track:#24324B;
    --accent:#4FC3CC;--accent-ink:#06222A;--warn:#E8B64A;--bad:#FF8A80;--good:#7BD389;--tile:#1F3350;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk","Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.5;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 24px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 0 4px}
.brand{display:flex;gap:12px;align-items:center}
.patch{flex:none;width:46px;height:46px}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:700}
.tag{margin:2px 0 0;color:var(--muted);font-size:13px}
h2{font-size:19px;margin:18px 0 6px}
h3{font-size:16px;margin:24px 0 2px;padding-top:16px;border-top:1px solid var(--line)}
.hint{margin:0 0 10px;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mini{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.steps{display:flex;margin:12px 0 14px}
.steps span{flex:1;text-align:center;font-size:13px;color:var(--muted);position:relative;padding-top:20px}
.steps span::before{content:'';position:absolute;top:2px;inset-inline-start:50%;width:12px;height:12px;margin-inline-start:-6px;border-radius:50%;background:var(--bg);border:2px solid var(--line);z-index:1}
.steps span::after{content:'';position:absolute;top:7px;inset-inline-start:-50%;width:100%;height:2px;background:var(--line)}
.steps span:first-child::after{display:none}
.steps span.done::before,.steps span.on::before{background:var(--accent);border-color:var(--accent)}
.steps span.done::after,.steps span.on::after{background:var(--accent)}
.steps span.on{color:var(--ink);font-weight:700}
/* flight-plan panel: the one bold element */
.space{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(120% 100% at 50% 42%,#1D3166 0%,#0B1430 72%);border:1px solid rgba(255,255,255,.08);margin:6px 0 4px}
.space svg{display:block;width:100%;height:auto}
.orb{fill:none;stroke:rgba(255,255,255,.14)}
.arc{fill:none;stroke:rgba(255,255,255,.32);stroke-dasharray:2 4;stroke-width:1.2}
.trail{fill:none;stroke:#5ED6DE;stroke-width:2.4;stroke-linecap:round}
.trail.glow{stroke-width:8;opacity:.22}
.space svg text{fill:#B7C4E4;font-size:10px;font-family:inherit}
.pulse{fill:none;stroke:#5ED6DE;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(2.6)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.5}}
.hud{position:absolute;inset-inline-start:14px;top:10px;color:#fff;line-height:1.1}
.hud b{display:block;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.hud b.sm{font-size:18px}
.hud small{display:block;color:#B7C4E4;font-size:12px}
.chip{position:absolute;inset-inline-end:10px;top:10px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
/* options */
.opt{display:flex;gap:12px;width:100%;text-align:start;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 8px;cursor:pointer}
.opt[aria-checked=true]{border-color:var(--accent);outline:1px solid var(--accent);background:var(--tile);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.opt:disabled{opacity:.45;cursor:not-allowed}
.ic{flex:none;width:46px;height:46px;border-radius:12px;background:var(--tile);color:var(--accent);display:grid;place-items:center}
.ic svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ob{display:block;flex:1;min-width:0}
.on{display:block;font-weight:700}
.od{display:block;color:var(--muted);font-size:14px;line-height:1.35}
.os{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px;font-size:13px;color:var(--muted)}
.tick{flex:none;position:relative;width:22px;height:22px;border:2px solid var(--line);border-radius:50%}
.tick.sq{border-radius:6px}
.tick::after{content:'';position:absolute;left:50%;top:50%;width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translate(-50%,-62%) rotate(45deg);opacity:0}
.opt[aria-checked=true] .tick{background:var(--accent);border-color:var(--accent)}
.opt[aria-checked=true] .tick::after{opacity:1}
/* meters */
.dock{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-top:18px}
.gauge{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;font-size:13px;margin:5px 0}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--good)}
.gauge.mid .bar i{background:var(--warn)}
.gauge.over .bar i{background:var(--bad)}
.gauge.over b{color:var(--bad)}
.gauge b{font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{display:block;width:100%;padding:15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;margin:8px 0}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--bad);font-size:14px;margin:4px 0}
.warn{color:var(--warn);font-size:14px;margin:4px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row b.bad{color:var(--bad)}
input[type=range]{width:100%;accent-color:var(--accent);margin:8px 0}
.log{list-style:none;padding:0;margin:8px 0}
.log li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.log li:first-child{font-weight:700}
.sheet{position:fixed;left:0;right:0;inset-inline:0;bottom:0;background:var(--surface);border-top:3px solid var(--accent);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;box-shadow:0 -8px 24px rgba(0,0,0,.3)}
.sheet h3{margin:0 0 4px;padding:0;border:0}
.sheet p{margin:0 0 8px;color:var(--muted)}
.pad{height:240px}
.result{margin:12px 0;padding:16px;border-radius:14px;border:2px solid var(--line)}
.result.ok{border-color:var(--good);background:var(--surface);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.result.fail{border-color:var(--bad);background:var(--surface);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.result h2{margin:0 0 4px}
.result p{margin:0}
.stars{font-size:32px;letter-spacing:4px;color:#E5A100;margin-top:6px}
.hbtns{display:flex;gap:8px;align-items:center}
.mini.round{width:36px;height:36px;padding:0;border-radius:50%;font-weight:700}
.tip{border-inline-start:3px solid var(--accent);padding:6px 10px;margin:8px 0;background:var(--tile);border-radius:6px;font-size:14px}
.src{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.team{margin:14px 0 0;font-size:14px;color:var(--muted)}
.team b{display:block;color:var(--ink)}
.big{font-size:25px;line-height:1.25;margin:18px 0 6px}
.how{list-style:none;counter-reset:n;padding:0;margin:10px 0 16px}
.how li{counter-increment:n;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.how li::before{content:counter(n);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:14px}
a{color:var(--accent);word-break:break-all}
/* mission console */
.fbar{display:flex;justify-content:space-between;align-items:center;padding:14px 0 8px}
.console{background:#0B1430;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.1);color:#fff}
.hudrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px}
.hb{background:#14214A;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 4px;text-align:center;min-width:0}
.hb small{display:block;color:#AEBBDB;font-size:12px}
.hb b{display:block;color:#FFD43B;font-size:14.5px;line-height:1.3;overflow-wrap:break-word;word-break:normal;font-variant-numeric:tabular-nums}
#h3{white-space:nowrap;font-size:13.5px}
.vp{position:relative;width:100%;aspect-ratio:3/4;max-height:70vh;background:#030614}
.vp canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vtxt{position:absolute;top:10px;left:12px;right:12px;text-align:center;pointer-events:none}
.vtxt h3{margin:0;padding:0;border:0;color:#FFD43B;font-size:22px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.vtxt p{margin:6px 0 0;color:#fff;font-size:14.5px;line-height:1.45;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.big{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:88px;font-weight:700;color:#fff;text-shadow:0 0 28px #FFB347;pointer-events:none;line-height:1}
.vchip{position:absolute;left:10px;right:10px;bottom:10px;text-align:center;font-size:13px;color:#fff;background:rgba(0,0,0,.4);border-radius:999px;padding:6px 12px}
#vrep{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;width:72%;margin:0}
.btn.gold{background:#FFD43B;color:#1A1A1A;border-color:#FFD43B}
.ftabs{display:flex;gap:8px;overflow-x:auto;padding:10px 10px 6px;scrollbar-width:none}
.ftabs::-webkit-scrollbar{display:none}
.ftab{flex:none;padding:10px 14px;border-radius:12px;background:#1B2748;color:#8FA0C4;border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
.ftab.done{border-color:#7BD389;color:#D5F5DB}
.ftab.now{background:#FFD43B;color:#1A1A1A;font-weight:700}
.ctrls{display:flex;gap:8px;padding:6px 10px 12px}
.cb{flex:1;min-width:0;padding:12px 6px;border-radius:12px;border:0;background:#FFD43B;color:#1A1A1A;font-weight:700;font-size:15px;cursor:pointer}
.cb.alt{background:#1B2748;color:#fff}
select.cb{appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center}
#fpanel{margin-top:14px}
ul.plain{padding-inline-start:20px;margin:6px 0}
ul.plain li{margin:6px 0;overflow-wrap:anywhere}
</style>
</head>

<script>
'use strict';
let dip=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(S.phase==='intro')render();});
window.addEventListener('appinstalled',()=>{dip=null;if(S.phase==='intro')render();});
function installApp(){if(!dip)return;dip.prompt();dip.userChoice.finally(()=>{dip=null;render();});}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}

  S.mission=id;

function calc(){
  const m=find(MISSIONS,S.mission),c=m.crew;
  const La=find(LAUNCHERS,S.sel.launcher),P=find(POWER,S.sel.power),C=find(COMMS,S.sel.comms),sh=find(SHIELD,S.sel.shield);
  let mass=m.bus+P.mass+C.mass+sh.mass*(c?7:1);
  let cost=m.cost+La.cost+P.cost+C.cost+sh.cost*(c?5:1);
  let load=m.load+C.load;
  let pts=0;
  S.sel.instr.forEach(id=>{const i=find(INSTR,id);mass+=i.mass;cost+=i.cost;load+=i.load;pts+=i.pts;});
  let en=null,ls=null;
  if(m.lands){en=find(ENTRY,S.sel.entry);mass+=en.mass*(c?8:1);cost+=en.cost*(c?4:1);}
  if(c){ls=find(LS,S.sel.ls);mass+=ls.mass;cost+=ls.cost;}
  return {m,La,P,C,sh,en,ls,mass,cost,load,pts};
}
function errors(c,cf){
  const e=[];
  if(c.cost>c.m.budget)e.push(t('e_budget',{n:fmt(c.cost-c.m.budget)}));
  const cap=c.La.cap*cf;
  if(c.mass>cap)e.push(t('e_mass',{n:fmt(c.mass-cap)}));
  if(c.P.out<c.load)e.push(t('e_power',{n:fmt(c.load-c.P.out)}));
  return e;
}

/* ---------- Orbit diagram ---------- */
const STARS=(()=>{let seed=7,o='';const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<46;i++){const x=r()*320,y=r()*240,z=r();o+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(0.4+z*0.9).toFixed(1)}" fill="#fff" opacity="${(0.25+r()*0.6).toFixed(2)}"/>`;}
  return o;})();
function orbit(p,hud,state){
  const cx=160,cy=122,a=78,e=0.2051;
  const pos=q=>{
    const M=q*Math.PI;let E=M;
    for(let i=0;i<8;i++)E=M+e*Math.sin(E);
    const th=2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2),Math.sqrt(1-e)*Math.cos(E/2));
    const r=a*(1-e*e)/(1+e*Math.cos(th));
    return [cx+r*Math.cos(th),cy-r*Math.sin(th)];
  };
  const path=(from,to)=>{let d='';const n=60;for(let i=0;i<=n;i++){const [x,y]=pos(from+(to-from)*i/n);d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}return d;};
  const [ex,ey]=pos(0),[mx,my]=pos(1),[sx,sy]=pos(p);
  const q=Math.min(p,0.99),[x0,y0]=pos(q),[x1,y1]=pos(q+0.01);
  const ang=(Math.atan2(y1-y0,x1-x0)*180/Math.PI).toFixed(1);
  let craft='';
  if(state==='fail'){
    craft=`<g stroke="#FF8A80" stroke-width="2.2" stroke-linecap="round"><path d="M${sx-5} ${sy-5}L${sx+5} ${sy+5}M${sx+5} ${sy-5}L${sx-5} ${sy+5}"/></g>`;
  }else if(p>0){
    craft=`<circle class="pulse" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="4"/><g transform="translate(${sx.toFixed(1)} ${sy.toFixed(1)}) rotate(${ang}) scale(1.15)"><rect x="-3" y="-10" width="6" height="5" fill="#2F63C8"/><rect x="-3" y="5" width="6" height="5" fill="#2F63C8"/><rect x="-5" y="-3.2" width="9" height="6.4" rx="1" fill="#F1CC62"/><path d="M4 -3.2L8.5 0L4 3.2z" fill="#fff"/></g>`;
  }
  return `<div class="space"><svg viewBox="0 0 320 240" role="img" aria-label="${t('earth')} - ${t('mars')}">
    <defs>
      <radialGradient id="gSun"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".6" stop-color="#F2B632"/><stop offset="1" stop-color="#E58A00"/></radialGradient>
      <radialGradient id="gGlow"><stop offset="0" stop-color="#F2B632" stop-opacity=".5"/><stop offset="1" stop-color="#F2B632" stop-opacity="0"/></radialGradient>
      <radialGradient id="gE" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#8CC4FF"/><stop offset=".6" stop-color="#2F6FD0"/><stop offset="1" stop-color="#173B7A"/></radialGradient>
      <radialGradient id="gM" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#F29A73"/><stop offset=".6" stop-color="#C2502E"/><stop offset="1" stop-color="#6E2814"/></radialGradient>
    </defs>
    ${STARS}
    <circle class="orb" cx="${cx}" cy="${cy}" r="62"/><circle class="orb" cx="${cx}" cy="${cy}" r="94"/>
    <path class="arc" d="${path(0,1)}"/>
    ${p>0?`<path class="trail glow" d="${path(0,p)}"/><path class="trail" d="${path(0,p)}"/>`:''}
    <circle cx="${cx}" cy="${cy}" r="26" fill="url(#gGlow)"/><circle cx="${cx}" cy="${cy}" r="8" fill="url(#gSun)"/>
    <circle cx="${ex}" cy="${ey}" r="6.5" fill="url(#gE)"/><text x="${ex}" y="${ey+18}" text-anchor="middle">${t('earth')}</text>
    <circle cx="${mx}" cy="${my}" r="5" fill="url(#gM)"/><text x="${mx}" y="${my+17}" text-anchor="middle">${t('mars')}</text>
    ${state==='ok'?`<circle cx="${mx}" cy="${my}" r="10" fill="none" stroke="#7BD389" stroke-width="1.6"/>`:''}
    ${craft}
  </svg>${hud||''}</div>`;
}

function gauge(label,val,max,txt,mode){
  // mode 'cap': over max is bad. 'risk': higher ratio is worse. 'life': lower ratio is worse

/* ---------- Flight ---------- */
const SCN={
 count:{kind:'earth',dur:5,t:[-5,0],alt:[0,0]},
 lift:{kind:'earth',dur:7,t:[0,45],alt:[0,5]},
 maxq:{kind:'earth',dur:6,t:[45,85],alt:[5,14]},
 sep:{kind:'earth',dur:7,t:[150,170],alt:[65,85]},
 fair:{kind:'earth',dur:5,t:[205,225],alt:[105,125]},
 orbit:{kind:'space',dur:7,t:[490,540],alt:[200,200]},
 tmi:{kind:'space',dur:6,t:[5400,5700],alt:[200,9000]},
 cruise:{kind:'cruise',dur:0},
 appr:{kind:'mars',dur:6,alt:[20000,500]},
 moi:{kind:'mars',dur:8,alt:[500,400]},
 entry:{kind:'mars',dur:11,alt:[125,0]},
 touch:{kind:'mars',dur:4,alt:[0,0]},
 deploy:{kind:'mars',dur:8,alt:[0,0]},
 done:{kind:'mars',dur:0,alt:[0,0]}
};
const DURS={count:8,lift:25,maxq:20,sep:25,fair:20,orbit:35,tmi:30,appr:25,moi:55,entry:45,touch:12,deploy:30};
Object.keys(DURS).forEach(k=>{SCN[k].dur=DURS[k];});
function sceneList(m){
  const l=['count','lift','maxq','sep','fair','orbit','tmi','cruise','appr'];
  if(m.lands)l.push('entry','touch');else l.push('moi');
  l.push('deploy','done');return l;
}
function sceneTxt(id){
  const c=calc(),m=c.m;
  let nk='sc_'+id+'_n',dk='sc_'+id+'_d';
  if(id==='deploy'){nk='sc_deploy_n_'+m.id;dk='sc_deploy_d_'+m.id;}
  if(id==='entry')dk='sc_entry_d_'+c.en.id;
  return [t(nk),t(dk)];
}
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const lp=(a,b,k)=>a+(b-a)*k;
const pad2=n=>String(n).padStart(2,'0');
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const ease=k=>k*k*(3-2*k);
let raf=0,lastT=0,uiCache={};
function clock(sec){
  const neg=sec<0;let s=Math.floor(Math.abs(sec));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60);s=s%60;
  return 'T'+(neg?'-':'+')+(h?pad2(h)+':':'')+pad2(m)+':'+pad2(s);
}
function cruiseP(f){return cl((f.tick+cl(f.ta/f.tp,0,1))/f.ticks,0,1);}
function hudVals(f,id){
  const sc=SCN[id],sp=sc.dur?cl(f.st/sc.dur,0,1):1,ku=' '+t('u_km');
  let lab='hud_alt',val='',tm='';
  if(sc.kind==='earth'||sc.kind==='space'){val=fmt(lp(sc.alt[0],sc.alt[1],sp))+ku;tm=clock(lp(sc.t[0],sc.t[1],sp));}
  else if(id==='cruise'){lab='hud_trav';val=fmt(cruiseP(f)*680)+' '+t('u_mkm');tm='D+'+f.day;}
  else if(id==='appr'){lab='hud_dist';val=fmt(lp(sc.alt[0],sc.alt[1],sp))+ku;tm='D+'+f.days;}
  else if(id==='entry'){val=fmt(125*Math.pow(1-sp,1.6))+ku;const s=Math.round(sp*420);tm='EDL+'+pad2(Math.floor(s/60))+':'+pad2(s%60);}
  else{const orb=!calc().m.lands;val=(id==='moi'?fmt(lp(500,400,sp)):orb?'400':'0')+ku;tm='D+'+f.days;}
  return {lab,val,tm};
}
function startFlight(){
  const c=calc(),days=travelDays(S.offset);
  S.fl={tick:0,ticks:Math.ceil(days/5),days,day:0,health:100,dose:0,supplies:c.ls?c.ls.days:null,acc:0,sciMul:1,siteOdds:0,log:[],paused:false,ev:null,done:false,dust:false,
    scenes:sceneList(c.m),si:0,st:0,ta:0,tp:280/Math.ceil(days/5),playing:true,launchFail:S.played&&Math.random()>c.La.rel,boom:false,bt:0,boomCode:null,outcome:null};
  S.phase='flight';window.scrollTo(0,0);render();startLoop();
}
function restartFlight(){startFlight();}
function startLoop(){cancelAnimationFrame(raf);lastT=performance.now();raf=requestAnimationFrame(frame);}
function frame(now){
  if(S.phase!=='flight'||!S.fl)return;
  const dt=Math.min(0.1,(now-lastT)/1000);lastT=now;
  const f=S.fl;
  if(f.playing&&!f.paused&&!f.done)advance(dt*S.speed);
  if(S.phase==='flight'){drawFlight();raf=requestAnimationFrame(frame);}
}
function advance(dt){
  const f=S.fl,id=f.scenes[f.si],sc=SCN[id];
  if(f.boom){f.bt+=dt;if(f.bt>2.8)finish(f.boomCode);return;}
  if(id==='cruise'){
    f.ta+=dt;
    while(f.ta>=f.tp&&!f.paused&&!f.done&&f.scenes[f.si]==='cruise'){f.ta-=f.tp;step();}
    return;
  }
  if(id==='done')return;
  f.st+=dt;
  if(id==='maxq'&&f.launchFail&&f.st>sc.dur*0.55){f.boom=true;f.bt=0;f.boomCode='launch';return;}
  if(id==='entry'&&f.outcome==='land'&&f.st>sc.dur*0.8){f.boom=true;f.bt=0;f.boomCode='land';return;}
  if(f.st>=sc.dur)nextScene();
}
function setScene(i){
  const f=S.fl;f.si=i;f.st=0;f.ta=0;
  if(f.scenes[i]==='orbit')f.log.push({k:'l_launch',p:{d:f.days}});
  updateFlightUI();
}
function nextScene(){
  const f=S.fl,id=f.scenes[f.si];
  if(id==='moi'&&f.outcome==='orbit')return finish('orbit');
  if(f.si<f.scenes.length-1)setScene(f.si+1);
}
function skipScene(){
  const f=S.fl;if(!f||f.paused||f.done||f.boom)return;
  const id=f.scenes[f.si];
  if(id==='cruise'){let n=0;while(n++<120&&!f.paused&&!f.done&&f.scenes[f.si]==='cruise')step();return;}
  if(id==='done')return;
  if(id==='maxq'&&f.launchFail){f.boom=true;f.bt=0;f.boomCode='launch';return;}
  if(id==='entry'&&f.outcome==='land'){f.boom=true;f.bt=0;f.boomCode='land';return;}
  nextScene();
}
function togglePlay(){const f=S.fl;if(!f)return;f.playing=!f.playing;updateFlightUI();}
function setSpeed(v){S.speed=parseFloat(v)||1;}
function refresh(){if(S.phase==='flight')updateFlightUI();else render();}
function step(){
  const f=S.fl;if(!f||f.paused||f.done)return;
  const c=calc();
  f.tick++;f.day=Math.min(f.tick*5,f.days);
  f.dose+=1.8*5*(1-c.sh.red);
  if(f.supplies!==null)f.supplies-=5;
  if(f.supplies!==null&&f.supplies<=0)return finish('supplies');
  if(c.m.crew&&f.dose>600)return finish('radiation');
  if(f.tick>=f.ticks)return arrive();
  if(f.tick===Math.round(f.ticks*0.3))return ask('corr');
  const r=Math.random();
  const lowPower=(c.P.out-c.load)<=0.25*c.P.out;
  if(Math.random()<[0.03,0.06,0.10][S.wx.A])return ask('storm');
  if(r<0.06){
    const h=Math.round(5+Math.random()*7);
    f.health-=h;f.log.push({k:'l_debris',p:{day:f.day,h}});
    if(f.health<=0)return finish('systems');
  }else if(r<0.10)return ask('fault');
  else if(r<0.13)return ask('comm');
  else if(r<0.16&&lowPower)return ask('power');
  else if(r<0.19&&c.m.crew)return ask('med');
  refresh();
}
function ask(ev){
  const f=S.fl;f.paused=true;f.ev=ev;refresh();
}
function choose(i){
  const f=S.fl,c=calc(),ev=f.ev,red=c.sh.red;
  f.paused=false;f.ev=null;
  if(ev==='storm'){
    const factor=i===0?0.3:1;
    const h=Math.round(18*(1-red)*factor),r=Math.round(100*(1-red)*factor);
    f.health-=h;f.dose+=r;
    if(i===0&&f.supplies!==null)f.supplies-=2;
    f.log.push({k:i===0?'l_storm_s':'l_storm',p:{day:f.day,h,r}});
  }else if(ev==='fault'){
    if(i===0){
      if(Math.random()<0.6)f.log.push({k:'l_fault_ok',p:{day:f.day}});
      else{f.health-=15;f.log.push({k:'l_fault_bad',p:{day:f.day,h:15}});}
    }else{f.health-=5;f.log.push({k:'l_fault_bk',p:{day:f.day,h:5}});}
  }else if(ev==='corr'){
    if(i===0){f.acc+=0.05;f.log.push({k:'l_burn',p:{day:f.day}});}
    else{f.acc-=0.05;f.log.push({k:'l_skip',p:{day:f.day}});}
  }else if(ev==='comm'){
    if(i===0){f.acc-=0.02;f.log.push({k:'l_comm_a',p:{day:f.day}});}
    else{f.sciMul*=0.85;f.log.push({k:'l_comm_b',p:{day:f.day}});}
  }else if(ev==='power'){
    if(i===0){f.sciMul*=0.9;f.log.push({k:'l_power_a',p:{day:f.day}});}
    else{f.health-=8;f.log.push({k:'l_power_b',p:{day:f.day,h:8}});}
  }else if(ev==='med'){
    if(i===0){f.supplies-=3;f.log.push({k:'l_med_a',p:{day:f.day}});}
    else if(Math.random()<0.5)f.log.push({k:'l_med_ok',p:{day:f.day}});
    else{f.sciMul*=0.85;f.log.push({k:'l_med_bad',p:{day:f.day}});}
  }else if(ev==='site'){
    if(i===0){f.siteOdds=0.05;f.sciMul*=0.85;f.log.push({k:'l_site_a'});}
    else{f.siteOdds=-0.07;f.sciMul*=1.3;f.log.push({k:'l_site_b'});}
    f.site=i;return afterSite();
  }else if(ev==='orb'){
    if(i===0){f.siteOdds=-0.04;f.sciMul*=1.2;f.log.push({k:'l_orb_a'});}
    else{f.siteOdds=0.03;f.sciMul*=0.9;f.log.push({k:'l_orb_b'});}
    return afterSite();
  }else if(ev==='dust'){
    if(i===0){
      f.log.push({k:'l_wait'});
      if(f.supplies!==null){f.supplies-=20;if(f.supplies<=0)return finish('supplies');}
      else f.health-=3;
    }else{f.dust=true;f.log.push({k:'l_go'});}
    if(f.health<=0)return finish('systems');
    return resolve();
  }
  if(f.health<=0)return finish('systems');
  if(c.m.crew&&f.dose>600)return finish('radiation');
  if(f.supplies!==null&&f.supplies<=0)return finish('supplies');
  refresh();
}
function arrive(){
  const f=S.fl;
  f.day=f.days;
  f.log.push({k:'l_arrive',p:{day:f.days}});
  ask(calc().m.lands?'site':'orb');
}
function afterSite(){
  if(Math.random()<dustRisk(S.offset)){S.fl.dustEvent=true;return ask('dust');}
  resolve();
}
function odds(){
  const f=S.fl,c=calc();
  const base=c.m.lands?c.en.rel:0.95;
  let p=base*(0.6+0.4*Math.max(0,f.health)/100)+f.acc+(f.siteOdds||0);
  if(f.dust&&c.m.lands)p*=0.8;
  return Math.max(0.05,Math.min(0.99,p));
}
function resolve(){
  const f=S.fl,c=calc();
  f.odds=odds();
  f.outcome=Math.random()>f.odds?(c.m.lands?'land':'orbit'):'ok';
  setScene(f.scenes.indexOf('appr'));
}
function finish(code){
  S.played=true;
  const f=S.fl,c=calc();
  f.done=true;
  const health=Math.max(0,Math.round(f.health));
  const res={code,health,dose:Math.round(f.dose),odds:f.odds?Math.round(f.odds*100):null,budgetLeft:c.m.budget-c.cost,sci:0,score:0,stars:0};
  if(code==='ok'){
    let sci=c.pts*c.C.f*(health/100)*(f.sciMul||1);
    if(f.dust&&c.P.solar)sci*=0.6;
    res.sci=Math.round(sci);
    res.score=Math.round(100+res.sci+Math.max(0,res.budgetLeft)/10+(c.m.crew?Math.max(0,200-res.dose/3):0));
    res.stars=1+(health>=70?1:0)+((c.m.crew?res.dose<=400:res.sci>=80)?1:0);
  }
  res.wx={F:S.wx.F,A:S.wx.A,dust:Math.round(dustRisk(S.offset)*100),dustEvent:!!f.dustEvent,arrived:['ok','land','orbit'].includes(code)};
  newWx();
  S.res=res;S.phase='report';window.scrollTo(0,0);render();
}

  return `<div class="sheet" role="dialog" aria-modal="true"><h3>${t('ev_'+ev+'_t')}</h3><p>${t('ev_'+ev+'_x')}</p>
    <button class="btn" onclick="choose(0)">${t('ev_'+ev+'_a')}</button>

function setUI(key,id,val){
  if(uiCache[key]===val)return;
  uiCache[key]=val;const el=document.getElementById(id);if(el)el.textContent=val;
}
function updateFlightUI(){
  const f=S.fl;if(!f||S.phase!=='flight')return;
  const $=x=>document.getElementById(x);
  if(!$('cv'))return;
  const c=calc(),id=f.scenes[f.si],tx=sceneTxt(id);
  if(!f.boom){setUI('vt','vt',tx[0]);setUI('vd','vd',tx[1]);}
  setUI('h1','h1',tx[0]);
  $('ftabs').innerHTML=f.scenes.map((s,i)=>`<span class="ftab ${i<f.si?'done':i===f.si?'now':''}" id="tab${i}">${i<f.si?'✓ ':''}${sceneTxt(s)[0]}</span>`).join('');
  if(uiCache.si!==f.si){
    uiCache.si=f.si;
    const el=$('tab'+f.si),box=$('ftabs');
    if(el&&box){const r=el.getBoundingClientRect(),b=box.getBoundingClientRect();box.scrollLeft+=(r.left+r.width/2)-(b.left+b.width/2);}
  }
  $('bplay').textContent=f.playing?t('btn_pause'):t('btn_play');
  $('vrep').style.display=(id==='done'&&!f.done)?'block':'none';
  const hp=Math.max(0,Math.round(f.health));
  let h=gauge(t('f_health'),hp,100,hp+'%','life');
  if(c.m.crew){
    h+=gauge(t('f_rad'),f.dose,600,fmt(f.dose)+' / 600 '+t('u_msv'),'risk');
    h+=gauge(t('f_sup'),Math.max(0,f.supplies),c.ls.days,fmt(Math.max(0,f.supplies))+' '+t('u_days'),'life');
  }
  h+=`<h3>${t('f_log')}</h3><ul class="log">${f.log.slice().reverse().slice(0,7).map(e=>`<li>${t(e.k,e.p)}</li>`).join('')}</ul>`;
  if(f.paused&&f.ev)h+=`<div class="pad"></div>`+sheet(f.ev);
  $('fpanel').innerHTML=h;
}
function hudUpdate(f,id){
  if(!document.getElementById('h2'))return;
  const v=hudVals(f,id);
  setUI('h2l','h2l',t(v.lab));setUI('h2','h2',v.val);setUI('h3','h3',v.tm);
  setUI('vb','vb',id==='count'&&!f.boom?String(cl(Math.ceil(5*(1-f.st/SCN.count.dur)),1,5)):'');
  const ch=id==='cruise'?t('f_delay',{m:Math.max(1,Math.round(lp(1,12,cruiseP(f))))}):'';
  setUI('vc','vc',ch);document.getElementById('vc').style.display=ch?'block':'none';
  if(f.boom){setUI('vt','vt',t('sc_boom_n'));setUI('vd','vd',t(f.boomCode==='land'?'sc_crash_d':'sc_boom_d'));}
}

/* ---------- Scene drawing (canvas) ---------- */
function mix(c1,c2,k){
  const p=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
  const a=p(c1),b=p(c2);
  return 'rgb('+a.map((v,i)=>Math.round(lp(v,b[i],k))).join(',')+')';
}
function stars(g,W,H,alpha,tg,shift){
  if(alpha<=0)return;
  g.fillStyle='#fff';
  for(let i=0;i<90;i++){
    g.globalAlpha=alpha*(0.55+0.45*Math.sin(tg*1.7+i*1.3));
    g.beginPath();g.arc(rnd(i)*W,(rnd(i+300)*H+shift)%H,0.5+rnd(i+600)*1.2,0,6.283);g.fill();
  }
  g.globalAlpha=1;
}
function spaceBg(g,W,H,tg,shift){
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#030614');gr.addColorStop(1,'#0C1840');
  g.fillStyle=gr;g.fillRect(0,0,W,H);stars(g,W,H,1,tg,shift||0);
}
function bgSky(g,W,H,A,tg,shift){
  const a=cl(A/70,0,1),gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,mix('#4A90E2','#02040C',a));gr.addColorStop(1,mix('#A9D2FF','#0B1633',a));
  g.fillStyle=gr;g.fillRect(0,0,W,H);stars(g,W,H,cl((A-25)/40,0,1),tg,shift);
}
function clouds(g,W,H,off,A){
  if(A>25)return;
  g.fillStyle='rgba(255,255,255,'+(0.75*(1-A/25))+')';
  for(let i=0;i<5;i++){
    const x=rnd(i+20)*W,y=(rnd(i+40)*H*0.8+off)%H;
    for(let k=0;k<4;k++){g.beginPath();g.ellipse(x+k*16,y+(k%2)*5,26,12,0,0,6.283);g.fill();}
  }
}
function padDraw(g,W,H,gy){
  g.fillStyle='#3E7D3A';g.fillRect(0,gy,W,H-gy+2);
  g.fillStyle='#5C6068';g.fillRect(W*0.28,gy-H*0.02,W*0.44,H*0.02);
  g.fillStyle='#7A7F88';g.fillRect(W*0.76,gy-H*0.17,W*0.03,H*0.17);
}
function earthBelow(g,W,H,A){
  const R=W*1.5,hz=lp(H*0.06,H*0.24,cl((A-60)/140,0,1)),cy=H-hz+R;
  g.fillStyle='rgba(110,180,255,.35)';g.beginPath();g.arc(W/2,cy,R+14,0,6.283);g.fill();
  const gr=g.createLinearGradient(0,cy-R,0,cy-R+H*0.4);gr.addColorStop(0,'#3B84E0');gr.addColorStop(1,'#0E2F6B');
  g.fillStyle=gr;g.beginPath();g.arc(W/2,cy,R,0,6.283);g.fill();
}
function earth(g,cx,cy,r,tg,rot){
  const gr=g.createRadialGradient(cx-r*0.35,cy-r*0.35,r*0.1,cx,cy,r);
  gr.addColorStop(0,'#6EB0FF');gr.addColorStop(0.7,'#2F6FD0');gr.addColorStop(1,'#12306A');
  g.fillStyle=gr;g.beginPath();g.arc(cx,cy,r,0,6.283);g.fill();
  g.save();g.beginPath();g.arc(cx,cy,r,0,6.283);g.clip();
  g.fillStyle='rgba(76,160,84,.85)';
  for(let i=0;i<7;i++){
    const a=rnd(i+70)*6.283+rot,d=rnd(i+90)*r*0.75;
    g.beginPath();g.ellipse(cx+Math.cos(a)*d,cy+Math.sin(a)*d*0.8,r*(0.12+rnd(i)*0.2),r*(0.1+rnd(i+5)*0.16),rnd(i+8)*3,0,6.283);g.fill();
  }
  g.restore();
  g.strokeStyle='rgba(140,200,255,.45)';g.lineWidth=Math.max(2,r*0.04);
  g.beginPath();g.arc(cx,cy,r+g.lineWidth/2,0,6.283);g.stroke();
}
function marsGlobe(g,cx,cy,r){
  const gr=g.createRadialGradient(cx-r*0.35,cy-r*0.35,r*0.1,cx,cy,r);
  gr.addColorStop(0,'#F0A57F');gr.addColorStop(0.6,'#C2502E');gr.addColorStop(1,'#5E2312');
  g.fillStyle=gr;g.beginPath();g.arc(cx,cy,r,0,6.283);g.fill();
  g.save();g.beginPath();g.arc(cx,cy,r,0,6.283);g.clip();
  g.fillStyle='rgba(90,35,20,.45)';
  for(let i=0;i<6;i++){
    const a=rnd(i+30)*6.283,d=rnd(i+50)*r*0.7;
    g.beginPath();g.ellipse(cx+Math.cos(a)*d,cy+Math.sin(a)*d*0.8,r*(0.1+rnd(i+2)*0.18),r*(0.08+rnd(i+4)*0.12),rnd(i)*3,0,6.283);g.fill();
  }
  g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.ellipse(cx,cy-r*0.93,r*0.28,r*0.08,0,0,6.283);g.fill();
  g.restore();
  g.strokeStyle='rgba(255,170,130,.35)';g.lineWidth=Math.max(1.5,r*0.03);
  g.beginPath();g.arc(cx,cy,r+g.lineWidth/2,0,6.283);g.stroke();
}
function flameDraw(g,cx,y,w,len,tg){
  const fl=len*(0.85+0.15*Math.sin(tg*40)),gr=g.createLinearGradient(0,y,0,y+fl);
  gr.addColorStop(0,'#FFF6C8');gr.addColorStop(0.3,'#FFC24A');gr.addColorStop(1,'rgba(255,90,20,0)');
  g.fillStyle=gr;g.beginPath();g.moveTo(cx-w/2,y);g.quadraticCurveTo(cx,y+fl*1.15,cx+w/2,y);g.fill();
}
function smoke(g,cx,gy,W,H,k,tg){
  g.fillStyle='#F3F4F7';
  for(let i=0;i<22;i++){
    const age=(tg*0.7+i/22)%1,dir=i%2?1:-1;
    const x=cx+dir*(8+age*W*0.38*(0.4+rnd(i))),y=gy-age*H*0.05-rnd(i+9)*6;
    g.globalAlpha=k*(1-age)*0.85;g.beginPath();g.arc(x,y,10+age*H*0.07,0,6.283);g.fill();
  }
  g.globalAlpha=1;
}
function shipDraw(g,x,y,s,ang,panels,tg){
  g.save();g.translate(x,y);g.rotate(ang);g.scale(s,s);
  const pw=panels*46;
  if(pw>1){
    g.fillStyle='#2F63C8';g.fillRect(-12-pw,-8,pw,16);g.fillRect(12,-8,pw,16);
    g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=0.8;
    for(let i=1;i<pw/8;i++){g.beginPath();g.moveTo(-12-i*8,-8);g.lineTo(-12-i*8,8);g.moveTo(12+i*8,-8);g.lineTo(12+i*8,8);g.stroke();}
    g.fillStyle='#8A93A6';g.fillRect(-14,-1.5,4,3);g.fillRect(10,-1.5,4,3);
  }
  g.fillStyle='#D9A82B';g.fillRect(-12,-18,24,36);
  g.fillStyle='#F1CC62';g.fillRect(-12,-18,24,6);
  g.fillStyle='#EEE';g.beginPath();g.ellipse(0,-23,9,3,0,0,6.283);g.fill();
  g.fillStyle='#6B7385';g.fillRect(-3,18,6,4);
  g.restore();
}
function rr(g,x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);g.fill();}
function boomFx(g,x,y,tb,W){
  const k=Math.max(0,tb),r=W*0.05+k*W*0.28,gr=g.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,'rgba(255,255,230,'+Math.max(0,1-k*0.4)+')');
  gr.addColorStop(0.35,'rgba(255,190,60,'+Math.max(0,0.95-k*0.5)+')');
  gr.addColorStop(0.7,'rgba(230,70,20,'+Math.max(0,0.7-k*0.5)+')');
  gr.addColorStop(1,'rgba(80,20,10,0)');
  g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,6.283);g.fill();
  g.fillStyle='rgba(255,210,120,.9)';
  for(let i=0;i<18;i++){const a=rnd(i)*6.283,d=r*(0.6+rnd(i+5)*0.9);g.beginPath();g.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,2+rnd(i+9)*3,0,6.283);g.fill();}
}
function lowerStage(g,cx,base,RH,RW,type){
  const h=RH*0.56;
  if(type==='heavy'){
    for(const sx of[-1,1]){
      const bx=cx+sx*RW*0.78;
      g.fillStyle='#DADFE8';g.fillRect(bx-RW*0.22,base-h*0.7,RW*0.44,h*0.7);
      g.fillStyle='#B5BCC9';g.beginPath();g.moveTo(bx-RW*0.22,base-h*0.7);g.quadraticCurveTo(bx,base-h*0.7-RH*0.1,bx+RW*0.22,base-h*0.7);g.fill();
    }
  }
  const gr=g.createLinearGradient(cx-RW/2,0,cx+RW/2,0);
  gr.addColorStop(0,'#C9CFDB');gr.addColorStop(0.35,'#F5F7FB');gr.addColorStop(1,'#B7BECC');
  g.fillStyle=gr;g.fillRect(cx-RW/2,base-h,RW,h);
  g.fillStyle='#1B1F2A';g.fillRect(cx-RW/2,base-h*0.55,RW,RH*0.012);g.fillRect(cx-RW/2,base-h*0.93,RW,RH*0.012);
  g.fillStyle='#C0392B';
  for(const sx of[-1,1]){g.beginPath();g.moveTo(cx+sx*RW/2,base-h*0.32);g.lineTo(cx+sx*(RW/2+RW*0.55),base+RH*0.01);g.lineTo(cx+sx*RW/2,base);g.closePath();g.fill();}
  g.fillStyle='#3A3F4B';g.beginPath();g.moveTo(cx-RW*0.3,base);g.lineTo(cx+RW*0.3,base);g.lineTo(cx+RW*0.2,base+RH*0.04);g.lineTo(cx-RW*0.2,base+RH*0.04);g.fill();
}
function upperStage(g,cx,ub,RH,RW,fair,tg){
  const gr=g.createLinearGradient(cx-RW/2,0,cx+RW/2,0);
  gr.addColorStop(0,'#C9CFDB');gr.addColorStop(0.35,'#F5F7FB');gr.addColorStop(1,'#B7BECC');
  g.fillStyle=gr;g.fillRect(cx-RW/2,ub-RH*0.30,RW,RH*0.30);
  g.fillStyle='#1B1F2A';g.fillRect(cx-RW/2,ub-RH*0.06,RW,RH*0.012);
  g.fillStyle='#3A3F4B';g.beginPath();g.moveTo(cx-RW*0.18,ub);g.lineTo(cx+RW*0.18,ub);g.lineTo(cx+RW*0.12,ub+RH*0.025);g.lineTo(cx-RW*0.12,ub+RH*0.025);g.fill();
  const ny=ub-RH*0.30;
  if(!fair){
    g.fillStyle=gr;g.beginPath();g.moveTo(cx-RW/2,ny);g.quadraticCurveTo(cx-RW/2,ny-RH*0.11,cx,ny-RH*0.14);g.quadraticCurveTo(cx+RW/2,ny-RH*0.11,cx+RW/2,ny);g.closePath();g.fill();
    g.fillStyle='#1B1F2A';g.fillRect(cx-RW/2,ny-RH*0.012,RW,RH*0.012);
  }else{
    shipDraw(g,cx,ny-RH*0.05,RW/36,0,0,tg);
    for(const sx of[-1,1]){
      g.save();g.translate(cx+sx*RW/2,ny);g.rotate(sx*fair*0.9);g.translate(sx*fair*RW*0.8,fair*fair*RH*0.5);
      g.globalAlpha=1-fair*0.5;g.fillStyle='#E6E9F0';
      g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(0,-RH*0.11,-sx*RW/2,-RH*0.14);g.lineTo(-sx*RW/2,0);g.closePath();g.fill();
      g.restore();
    }
    g.globalAlpha=1;
  }
}
function earthScene(g,W,H,id,sp,tg,f){
  const sc=SCN[id],A=lp(sc.alt[0],sc.alt[1],sp),c=calc(),type=c.La.id;
  bgSky(g,W,H,A,tg,id==='count'?0:tg*55);
  const k=({small:0.78,medium:0.9,heavy:1})[type],RH=H*0.42*k,RW=RH*({small:0.15,medium:0.17,heavy:0.19})[type],cx=W/2;
  const lift=id==='count'?0:id==='lift'?A*40:id==='maxq'?200+(A-5)*30:1e5;
  const gy=H*0.80+lift;
  if(lift<H){clouds(g,W,H,lift*0.6,A);padDraw(g,W,H,gy);}
  if(A>40)earthBelow(g,W,H,A);
  const base=H*0.80-Math.min(lift,H*0.10);
  let sm=0;
  if(id==='count')sm=cl((sp-0.64)/0.36,0,1)*0.8;
  if(id==='lift')sm=cl(1-A/3,0,1);
  if(sm>0)smoke(g,cx,gy,W,H,sm,tg);
  if(f.boom){boomFx(g,cx,base-RH*0.5,f.bt,W);return;}
  if(id==='maxq'){
    const v=Math.sin(cl((sp-0.1)/0.7,0,1)*Math.PI);
    if(v>0){g.fillStyle='rgba(255,255,255,'+0.4*v+')';g.beginPath();g.ellipse(cx,base-RH*0.62,RW*(1+v*0.9),RH*0.06,0,0,6.283);g.fill();}
  }
  const ub=base-RH*0.56;
  if(id==='sep'){
    const T=0.35;
    if(sp<T){
      flameDraw(g,cx,base+RH*0.04,RW*0.5,RH*0.5,tg);
      lowerStage(g,cx,base,RH,RW,type);upperStage(g,cx,ub,RH,RW,0,tg);
    }else{
      const o=(sp-T)/(1-T);
      g.save();g.translate(cx,base+o*o*H*0.9);g.rotate(o*0.35);lowerStage(g,0,0,RH,RW,type);g.restore();
      if(sp>0.45)flameDraw(g,cx,ub+RH*0.025,RW*0.4,RH*0.3,tg);
      upperStage(g,cx,ub,RH,RW,0,tg);
      if(o<0.25){g.fillStyle='rgba(255,230,150,.9)';for(let i=0;i<10;i++){g.beginPath();g.arc(cx+(rnd(i)-0.5)*RW*2.4,ub+(rnd(i+3)-0.3)*RH*0.1+o*60,2,0,6.283);g.fill();}}
    }
    return;
  }
  if(id==='fair'){
    flameDraw(g,cx,ub+RH*0.025,RW*0.4,RH*0.3,tg);
    upperStage(g,cx,ub,RH,RW,sp<0.2?0:cl((sp-0.2)/0.6,0,1)+0.001,tg);
    return;
  }
  const thrust=id==='count'?cl((sp-0.64)/0.36,0,1)*0.2:1,fl=RH*0.5*thrust;
  if(fl>0){
    flameDraw(g,cx,base+RH*0.04,RW*0.5,fl,tg);
    if(type==='heavy')for(const sx of[-1,1])flameDraw(g,cx+sx*RW*0.78,base,RW*0.28,fl*0.7,tg);
  }
  lowerStage(g,cx,base,RH,RW,type);upperStage(g,cx,ub,RH,RW,0,tg);
}
function orbitRing(g,ox,oy,rx,ry,tilt,a0,a1,col,dash){
  g.save();g.translate(ox,oy);g.rotate(tilt);g.strokeStyle=col;g.lineWidth=1.6;g.setLineDash(dash||[]);
  g.beginPath();g.ellipse(0,0,rx,ry,0,a0,a1);g.stroke();g.restore();g.setLineDash([]);
}
function onRing(ox,oy,rx,ry,tilt,a){
  const x=rx*Math.cos(a),y=ry*Math.sin(a),c=Math.cos(tilt),s=Math.sin(tilt);
  return [ox+x*c-y*s,oy+x*s+y*c];
}
function marsSky(g,W,H,A,tg){
  const k=1-cl(A/110,0,1),gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,mix('#0B0710','#9A5A3E',k));gr.addColorStop(1,mix('#1A0F18','#EBC19B',k));
  g.fillStyle=gr;g.fillRect(0,0,W,H);stars(g,W,H,cl((A-70)/40,0,1),tg,0);
}
function marsGround(g,W,H,gy){
  const gr=g.createLinearGradient(0,gy,0,H);gr.addColorStop(0,'#B4603C');gr.addColorStop(1,'#7A3A22');
  g.fillStyle=gr;g.fillRect(0,gy,W,H-gy);
  g.fillStyle='rgba(60,25,15,.5)';
  for(let i=0;i<12;i++){g.beginPath();g.ellipse(rnd(i+7)*W,gy+6+rnd(i+8)*(H-gy-10),6+rnd(i)*14,3+rnd(i+3)*6,0,0,6.283);g.fill();}
  g.fillStyle='rgba(235,190,150,.5)';g.fillRect(0,gy-2,W,3);
}
function dustVeil(g,W,H,tg){
  g.fillStyle='rgba(200,115,65,.32)';g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(240,190,140,.35)';g.lineWidth=2;
  for(let i=0;i<26;i++){
    const y=rnd(i+11)*H,x=((rnd(i+12)*W+tg*(120+rnd(i)*160))%(W+120))-60;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+50+rnd(i)*50,y+6);g.stroke();
  }
}
function capsuleDraw(g,x,y,s,glow){
  if(glow>0){
    const tail=g.createLinearGradient(0,y-130*s,0,y);tail.addColorStop(0,'rgba(255,150,60,0)');tail.addColorStop(1,'rgba(255,170,80,'+0.55*glow+')');
    g.fillStyle=tail;g.fillRect(x-16*s,y-130*s,32*s,130*s);
    const gr=g.createRadialGradient(x,y+22*s,4*s,x,y+22*s,70*s);
    gr.addColorStop(0,'rgba(255,240,200,'+glow+')');gr.addColorStop(0.4,'rgba(255,140,40,'+glow*0.8+')');gr.addColorStop(1,'rgba(255,60,0,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y+22*s,70*s,0,6.283);g.fill();
  }
  g.fillStyle='#D5D9E2';g.beginPath();g.moveTo(x-9*s,y-24*s);g.lineTo(x+9*s,y-24*s);g.lineTo(x+22*s,y+18*s);g.lineTo(x-22*s,y+18*s);g.closePath();g.fill();
  g.fillStyle='#4A3328';g.beginPath();g.ellipse(x,y+18*s,22*s,6*s,0,0,Math.PI);g.fill();
}
function chuteDraw(g,x,y,s,open){
  const L=70*s*open,w=64*s*open,h=30*s*open;
  g.strokeStyle='rgba(240,240,240,.8)';g.lineWidth=1;
  for(const k of[-1,-0.5,0,0.5,1]){g.beginPath();g.moveTo(x+k*w/2,y-L);g.lineTo(x+k*8*s,y);g.stroke();}
  g.fillStyle='#F4EFE6';g.beginPath();g.ellipse(x,y-L,w/2,h,0,Math.PI,0);g.fill();
  g.fillStyle='#D9482B';g.beginPath();g.ellipse(x,y-L,w/6,h,0,Math.PI,0);g.fill();
}
function landerDraw(g,x,y,s,fl,tg){

const kep=q=>{
  const a=78,e=0.2051,M=q*Math.PI;let E=M;
  for(let i=0;i<8;i++)E=M+e*Math.sin(E);
  const th=2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2),Math.sqrt(1-e)*Math.cos(E/2));
  const r=a*(1-e*e)/(1+e*Math.cos(th));
  return [160+r*Math.cos(th),122-r*Math.sin(th)];
};

/* ---------- Report ---------- */
function wxReport(r){
  const w=r.wx;
  if(!w||r.code==='launch')return '';
  return `<h3>${t('r_wx')}</h3><ul class="plain">
    <li>${t('r_wx_solar',{f:t('wx_lvl_'+w.F),a:t('wx_lvl_'+w.A)})}</li>
    ${w.arrived?`<li>${t(w.dustEvent?'r_wx_dust_y':'r_wx_dust_n',{n:w.dust})}</li>`:''}</ul>
    <p class="hint">${t('r_wx_note')}</p>`;
}
function viewReport(){
  const r=S.res,c=calc(),f=S.fl,ok=r.code==='ok';
  const title=ok?t('r_ok'):t('r_'+r.code);
  const text=ok?t('r_ok_'+c.m.id):t('r_'+r.code+'_x');
  let h=orbit(ok?1:Math.min(1,f.tick/f.ticks),'',ok?'ok':'fail');
  h+=`<div class="result ${ok?'ok':'fail'}"><h2>${title}</h2><p>${text}</p>
    ${ok?`<div class="stars" aria-label="${r.stars} / 3">${'★'.repeat(r.stars)}${'☆'.repeat(3-r.stars)}</div>`:''}</div>`;
  h+=`<div>`;
  if(r.odds!==null)h+=`<div class="row"><span>${t('r_odds',{n:r.odds})}</span></div>`;
  h+=`<div class="row"><span>${t('r_health',{n:r.health})}</span></div>`;
  if(c.m.crew)h+=`<div class="row"><span>${t('r_dose',{n:r.dose})}</span></div>`;
  if(ok){
    h+=`<div class="row"><span>${t('r_sci',{n:r.sci})}</span></div>`;
    h+=`<div class="row"><span>${t('r_cost',{n:fmt(r.budgetLeft)})}</span></div>`;
    h+=`<div class="row"><b>${t('r_score',{n:fmt(r.score)})}</b></div>`;
  }
  h+=`</div>${wxReport(r)}<h3>${t('r_why')}</h3><ul class="plain">${f.log.map(e=>`<li>${t(e.k,e.p)}</li>`).join('')}</ul>`;
  const tail=[];
  if(c.m.lands&&f.site===1)tail.push('fa_jezero');
  if(c.m.crew)tail.push('fa_rad');
  if(c.m.lands)tail.push('fa_land');
  if(c.P.solar){tail.push('fa_dustseason');tail.push('fa_dust');}
  const facts=tail.concat(['fa_window','fa_delay']);
  h+=`<h3>${t('r_facts')}</h3><ul class="plain">${facts.slice(0,3).map(k=>`<li>${t(k)}<span class="src">${t('src')} ${FSRC[k]?FSRC[k][S.lang]:''}</span></li>`).join('')}</ul>`;
  h+=`<button class="btn primary" onclick="go('design')">${t('btn_redesign')}</button>
      <button class="btn" onclick="newMission()">${t('btn_new')}</button>`;
  return h;
}

function viewIntro(){
  return `${orbit(0.45)}
    <h2 class="big">${t('intro_h')}</h2><p>${t('intro_p')}</p>
    <ol class="how">${[1,2,3,4].map(i=>`<li>${t('intro_'+i)}</li>`).join('')}</ol>
    <p class="hint">${t('intro_time')}</p>
    <button class="btn primary" onclick="go('design')">${t('btn_start')}</button>
    <button class="btn" onclick="go('about')">${t('btn_about')}</button>
    ${dip?`<button class="btn" onclick="installApp()">${t('btn_install')}</button>`:''}
    <p class="hint">${t('intro_sub')}</p>${teamLine()}`;
}
function viewAbout(){
  return `<h2>${t('about_h')}</h2><p>${t('about_p')}</p>
    <h3>${t('about_real')}</h3><ul class="plain">${[1,2,3,4,5,6].map(i=>`<li>${t('ab_'+i)}</li>`).join('')}</ul>
    <h3>${t('about_mars')}</h3><ul class="plain">${[1,2,3,4].map(i=>`<li>${t('mf_'+i)}</li>`).join('')}</ul>
    <p class="hint">${t('mf_src')}</p>
    <h3>${t('about_sim')}</h3><ul class="plain">${[1,2,3,4].map(i=>`<li>${t('ab_s'+i)}</li>`).join('')}</ul>
    <h3>${t('about_src')}</h3><p class="hint">${t('about_src_p')}</p>
    <ul class="plain">${SOURCES.map(x=>`<li><a href="https://${x.u}" target="_blank" rel="noopener">${x.n[S.lang]}</a><span class="src">${x.u}</span></li>`).join('')}</ul>
    <p class="hint">${t('about_ai')}</p>${teamLine()}
    <button class="btn primary" onclick="go(S.prev)">${t('btn_close')}</button>`;
}

/* ---------- Actions and render ---------- */
function pick(group,id){
  if(group==='mission')setMission(id);
  else if(group==='instr'){const i=S.sel.instr.indexOf(id);if(i>=0)S.sel.instr.splice(i,1);else S.sel.instr.push(id);}
  else S.sel[group]=id;
  render();
}
function go(ph){
  if(ph==='about'&&S.phase!=='about')S.prev=S.phase;
  if(ph!=='flight')clearInterval(S.timer);
  S.phase=ph;window.scrollTo(0,0);render();
}
function newMission(){S.offset=0;setMission('orbiter');go('design');}
function toggleLang(){S.lang=S.lang==='en'?'ar':'en';render();}
function render(){
  document.documentElement.lang=S.lang;
  document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  document.title=t('title');
  const views={intro:viewIntro,about:viewAbout,design:viewDesign,window:viewWindow,flight:viewFlight,report:viewReport};
  uiCache={};
  document.getElementById('app').innerHTML=(S.phase==='flight'?'':head())+views[S.phase]();
  if(S.phase==='flight'){updateFlightUI();drawFlight();}
}
render();
</script>
</body>
</html>
